[project]
name = "floodseg"
version = "0.2.0"
description = "Terrain-aware SAR flood segmentation on Sen1Floods11: does HAND help across flood events?"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["torch", "torchvision", "segmentation-models-pytorch", "numpy", "scipy", "rasterio", "pyyaml", "pandas"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
